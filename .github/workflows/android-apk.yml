name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

      - name: Ensure capacitor config exists
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            printf '%s\n' \
              '{' \
              '  "appId": "com.gradus.radio",' \
              '  "appName": "Gradus",' \
              '  "webDir": "dist"' \
              '}' > capacitor.config.json
          fi

      - name: Build web (fallback to offline)
        run: |
          if [ -f src/main.tsx ]; then
            npm run build
          else
            mkdir -p dist
            cp offline.html dist/index.html
          fi

      - name: Add Android platform
        run: npx cap add android || true

      - name: Generate app icons
        run: npx @capacitor/assets generate --android || true

      - name: Sync Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gradus-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
